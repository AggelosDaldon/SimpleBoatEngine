name: Build Simple Boat Engine
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Regenerate v2 wooden variants and neutral paint texture
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/generate_wood_boats.py
          python3 tools/generate_marine_assets.py
          python3 tools/generate_user_marine_models.py
          python3 tools/generate_inventory_icons.py
          python3 tools/generate_uploaded_marine_assets.py
          python3 tools/generate_shipwright_workbench.py
          python3 tools/generate_model_inventory_icons.py
          python3 tools/finalize_user_icons.py
      - name: Verify shipwright and marine assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('src/main/resources/assets/simpleboatengine')
          for key in ('boat_customizer','boat_builder'):
              for facing in ('north','east','south','west'):
                  path=root/'models/block'/f'{key}_{facing}.json'
                  model=json.loads(path.read_text())
                  assert len(model.get('elements',[])) >= 60, path
          for key in ('engine','fuel_bucket','fuel_canister','boat_recovery_kit',
                      'ice_breaker','pole_light','boat_stand'):
              path=root/'textures/item'/f'{key}_icon.png'
              with Image.open(path) as icon:
                  icon.verify()
              with Image.open(path) as icon:
                  assert icon.size==(256,256), path
          assert 'modId="daldonsboatadditions"' in Path(
              'src/main/resources/META-INF/mods.toml').read_text()
          offenders=[]
          for path in Path('src/main/java').rglob('*.java'):
              source=path.read_text()
              if 'modid = SimpleBoatEngine.ID' in source or 'modid=SimpleBoatEngine.ID' in source:
                  offenders.append(str(path))
          assert not offenders, '\\n'.join(offenders)
          print("Textures, model directions and mod identity verified")
          PY
      - name: Compile Forge 1.20.1
        run: gradle --no-daemon build --stacktrace
      - name: Verify resource pack metadata is packaged
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'simple-boat-engine-forge-1.20.1-*.jar' -print -quit)
          test -n "$JAR"
          unzip -p "$JAR" pack.mcmeta
          for ASSET in \
            assets/simpleboatengine/models/item/engine.json \
            assets/simpleboatengine/models/item/pole_light.json \
            assets/simpleboatengine/sounds/motor_loop.ogg \
            assets/simpleboatengine/textures/item/outboard_engine.png; do
            unzip -l "$JAR" "$ASSET" | grep -F "$ASSET"
          done
          for ASSET in \
            assets/simpleboatengine/textures/item/pole_light.png \
            data/simpleboatengine/recipes/pole_light.json; do
            unzip -l "$JAR" "$ASSET" | grep -F "$ASSET"
          done
      - name: Upload standalone JAR
        uses: actions/upload-artifact@v4
        with:
          name: simple-boat-engine-forge-1.20.1
          path: build/libs/*.jar
