name: Build Simple Boat Engine
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Regenerate v2 wooden variants and neutral paint texture
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/generate_wood_boats.py
          python3 tools/generate_marine_assets.py
      - name: Compile Forge 1.20.1
        run: gradle --no-daemon build --stacktrace
      - name: Verify resource pack metadata is packaged
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'simple-boat-engine-forge-1.20.1-*.jar' -print -quit)
          test -n "$JAR"
          unzip -p "$JAR" pack.mcmeta
          for ASSET in \
            assets/simpleboatengine/models/item/engine.json \
            assets/simpleboatengine/models/item/pole_light.json \
            assets/simpleboatengine/sounds/motor_loop.ogg \
            assets/simpleboatengine/textures/item/outboard_engine.png; do
            unzip -l "$JAR" "$ASSET" | grep -F "$ASSET"
          done
          for ASSET in \
            assets/simpleboatengine/textures/item/pole_light.png \
            data/simpleboatengine/recipes/pole_light.json; do
            unzip -l "$JAR" "$ASSET" | grep -F "$ASSET"
          done
      - name: Upload standalone JAR
        uses: actions/upload-artifact@v4
        with:
          name: simple-boat-engine-forge-1.20.1
          path: build/libs/*.jar
